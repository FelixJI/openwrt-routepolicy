name: Release OpenWrt packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 自动递增版本（填写 tag 时忽略）
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      tag:
        description: 可选：发布已有 vX.Y.Z tag，留空自动计算
        required: false
        type: string

concurrency:
  group: routepolicy-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENWRT_VERSION: 25.12.0
  OPENWRT_SDK_ARCHIVE: openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  OPENWRT_SDK_BASE: https://downloads.openwrt.org/releases/25.12.0/targets/x86/64

jobs:
  build-and-release:
    name: Build and publish OpenWrt 25.12 x86_64 APKs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 官方 checkout action 使用稳定主版本；发布调用 runner 自带 gh，避免额外 action。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve release version and source
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BUMP: ${{ inputs.bump || 'patch' }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the current resolver when publishing a tag created before this workflow.
          cp scripts/ci/release-version.py "$RUNNER_TEMP/release-version.py"
          tag="$INPUT_TAG"
          if [ "$EVENT" = push ]; then tag="$REF_NAME"; fi
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git checkout --detach "refs/tags/$tag"
            tag=$(python3 "$RUNNER_TEMP/release-version.py" --tag "$tag")
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            if [ "$REF_TYPE" != branch ] || [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo '自动发版只允许从默认分支运行；历史版本请填写已有 tag。' >&2
              exit 1
            fi
            tag=$(python3 "$RUNNER_TEMP/release-version.py" --mode "$BUMP")
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add routepolicy/Makefile luci-app-routepolicy/Makefile
            git commit -m "chore(release): $tag"
            echo 'created=true' >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf 'Release: %s\nSource: %s\n' "$tag" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run static checks before publishing
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --yes nftables shellcheck zstd
          sh tests/ci/static-checks.sh
          sh tests/ci/package-contract-tests.sh
          sh tests/converters/run.sh
          sh tests/core/run.sh
          pwsh -File tests/luci/check-static.ps1
          sh tests/ci/validate-workflows.sh
          if [ -f tests/ci/release-version-test.py ]; then python3 -B tests/ci/release-version-test.py; fi
      - name: Download and verify fixed OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output sdk.tar.zst "$OPENWRT_SDK_BASE/$OPENWRT_SDK_ARCHIVE"
          curl --fail --location --retry 3 --output sha256sums "$OPENWRT_SDK_BASE/sha256sums"
          awk -v file="$OPENWRT_SDK_ARCHIVE" '$2 == file || $2 == "*" file { print $1 "  sdk.tar.zst"; found = 1 } END { exit !found }' sha256sums | sha256sum --check --status
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          mv "${OPENWRT_SDK_ARCHIVE%.tar.zst}" sdk
      - name: Install official release feeds and build packages
        working-directory: sdk
        run: |
          set -eu
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp -a ../routepolicy package/routepolicy
          cp -a ../luci-app-routepolicy package/luci-app-routepolicy
          make defconfig
          printf '%s\n' 'CONFIG_PACKAGE_routepolicy=m' 'CONFIG_PACKAGE_luci-app-routepolicy=m' >> .config
          make defconfig
          make package/ucode/host/compile V=s
          staging_dir/hostpkg/bin/ucode -c ../luci-app-routepolicy/root/usr/share/rpcd/ucode/routepolicy
          staging_dir/hostpkg/bin/ucode ../tests/luci/ucode-popen-contract.uc
          PATH="$PWD/staging_dir/hostpkg/bin:$PATH" sh ../tests/core/smartdns-package-test.sh
          make package/routepolicy/compile package/luci-app-routepolicy/compile V=s -j"$(nproc)"
          make package/index V=s
      - name: Prepare APK, index and installation instructions
        run: |
          set -eu
          OPENWRT_SDK_VERSION="$OPENWRT_VERSION" GITHUB_SHA="$(git rev-parse HEAD)" sh scripts/ci/prepare-release.sh sdk release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CREATE_TAG: ${{ steps.version.outputs.created }}
        run: |
          set -eu
          if [ "$CREATE_TAG" = true ]; then
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "$RELEASE_TAG — OpenWrt 25.12 x86_64" \
            --verify-tag \
            --generate-notes \
            --notes "仅支持 OpenWrt 25.12 x86_64。新装默认禁用，升级保留现有设置。下载全部附件并按 INSTALL.txt 使用 install.sh；升级前备份配置。附件含双包、安装脚本、介质清单、索引与构建信息。"
